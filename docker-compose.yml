# Local stack: PostGIS with a couple of demo tables, plus the API.
#
#   docker compose up --build
#   curl http://localhost:5000/processes
#
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geodata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geodata"]
      interval: 5s
      timeout: 5s
      retries: 10

  # loads tests/*.gpkg into PostGIS with ogr2ogr, so the processes have real
  # data to clip. Layers already present are skipped, so later runs are quick
  gpkg-loader:
    image: ${GDAL_IMAGE:-ghcr.io/osgeo/gdal:alpine-small-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: geodata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GPKG_PATH: /data/625k_V5_Geology_UK_EPSG27700.gpkg
      GPKG_SCHEMA: public
      # three layers store a private SRS id that GDAL cannot map to EPSG, so
      # the CRS is assigned on load (no reprojection: the data is BNG)
      GPKG_SRS: EPSG:27700
      # set true to reload layers that are already in the database
      GPKG_FORCE: "false"
    volumes:
      - ./tests:/data:ro
      - ./docker/load-geopackage.sh:/load-geopackage.sh:ro
    # the script is mounted from the host checkout, which on Windows may
    # have CRLF line endings that /bin/sh cannot read, so strip them first
    # (.gitattributes keeps fresh checkouts LF; this covers older ones)
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /load-geopackage.sh > /tmp/load-geopackage.sh && exec /bin/sh /tmp/load-geopackage.sh"]
    restart: "no"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      gpkg-loader:
        condition: service_completed_successfully
    environment:
      PYGEOAPI_SERVER_URL: http://localhost:5000
      PYGEOAPI_LOGLEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: geodata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GEOCLIP_MAX_FEATURES: 10000
    ports:
      - "5000:80"

  # the standalone download service: same library, no pygeoapi
  download-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      gpkg-loader:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: geodata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GEOCLIP_MAX_FEATURES: 10000
      GEOCLIP_CORS_ORIGINS: "*"
    ports:
      - "5001:8000"

volumes:
  pgdata:
