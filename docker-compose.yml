# Local stack: PostGIS with a couple of demo tables, plus the API.
#
#   docker compose up --build
#   curl http://localhost:5000/processes
#
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geodata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geodata"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYGEOAPI_SERVER_URL: http://localhost:5000
      PYGEOAPI_LOGLEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: geodata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GEOCLIP_MAX_FEATURES: 10000
    ports:
      - "5000:80"

volumes:
  pgdata:
